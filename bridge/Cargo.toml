[package]
name = "faderz-bridge"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/danielclasen/faderz"
description = "Connects Mackie Control surfaces to faderz"
publish = false

# The end-to-end tests against a faderz binary (FADERZ_BIN); rtpmidid
# adds those against rtpmidid (tests/rtpmidid).
[features]
e2e = []
rtpmidid = ["e2e"]

[[test]]
name = "e2e"
required-features = ["e2e"]

[dependencies]
base64 = "=0.22.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "=0.3.4"
midir = "=0.11.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.29.0", features = ["connect", "rustls-tls-native-roots"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["form", "http1", "json", "tokio"] }
ring = "=0.17.14"
libc = "=0.2.191"
