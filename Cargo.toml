[package]
name = "faderz"
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/danielclasen/faderz"
description = "Operated multichannel broadcast audio mixer over MXL"
publish = false

# Every samplez crate at the same commit.
[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["alloc"] }
jsonschema = { version = "=0.61.2", default-features = false }
libc = "=0.2.191"
openraft = "=0.9.26"
rust-embed = { version = "=8.14.0", features = ["debug-embed", "deterministic-timestamps", "include-exclude", "mime-guess"] }
samplez = { git = "https://github.com/danielclasen/samplez", rev = "107c2318332254d5bc66fc3c6fef8dcf09d92734", version = "=0.1.0" }
samplez-dsp = { git = "https://github.com/danielclasen/samplez", rev = "107c2318332254d5bc66fc3c6fef8dcf09d92734", version = "=0.1.0" }
samplez-replica = { git = "https://github.com/danielclasen/samplez", rev = "107c2318332254d5bc66fc3c6fef8dcf09d92734", version = "=0.1.0" }
samplez-service = { git = "https://github.com/danielclasen/samplez", rev = "107c2318332254d5bc66fc3c6fef8dcf09d92734", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
samplez-mxl = { git = "https://github.com/danielclasen/samplez", rev = "107c2318332254d5bc66fc3c6fef8dcf09d92734", version = "=0.1.0" }
futures-util = { version = "=0.3.34", default-features = false, features = ["alloc", "sink"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
serde_yaml = "=0.9.34"
tokio-tungstenite = "=0.29.0"
tower = { version = "=0.5.3", features = ["util"] }
