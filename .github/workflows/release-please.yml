name: release-please

# A push to main updates the release PR. A release is cut only for the
# release PR's own merge commit, once CI has passed on it, and publishes
# the images that CI run built and checked.
#
# Publishing that failed after the release was cut is retried by
# re-running the failed jobs of this workflow's run while the CI run's
# image artifacts last (7 days), or at any time by running this
# workflow by hand with the release's tag and the id of a passing CI run
# of a push to main of the tagged commit; that CI run's artifacts must
# not have expired, or re-running its image jobs renews them.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, v<version> or faderz-bridge-v<version>
        required: true
      run-id:
        description: Id of the passing CI run of a push to main of the tagged commit
        required: true

permissions: {}

jobs:
  # Tags and GitHub releases for a merged release PR. The CI run must be
  # a push to main of that merge commit: a passing run of a later commit
  # does not vouch for it, and the images it built must be there to
  # publish. A release PR whose merge commit failed CI stays pending
  # until a re-run of that CI run passes.
  release:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # The bridge package's outputs carry its path as a prefix; the root
      # package's above carry none.
      bridge_release_created: ${{ steps.release.outputs['bridge--release_created'] }}
      bridge_tag_name: ${{ steps.release.outputs['bridge--tag_name'] }}
    steps:
      - name: Report a missing release token
        if: env.HAS_RELEASE_TOKEN != 'true'
        run: >-
          echo "::warning::RELEASE_PLEASE_TOKEN is not set. Release PRs are
          opened with GITHUB_TOKEN, so CI does not run on them and tags
          created here trigger no tag workflows."
      - id: pending
        name: Find the release PR this commit merged, and the images CI built of it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
            -q '[.[] | select(.merge_commit_sha == env.SHA and any(.labels[]; .name == "autorelease: pending"))][0].number // empty')
          echo "release PR merged as $SHA: ${pr:-none}"
          if [ -z "$pr" ]; then exit 0; fi
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" \
            -q '[.artifacts[] | select(.expired | not) | .name] | join(" ")')
          for a in faderz-image faderz-bridge-image; do
            case " $artifacts " in
              *" $a "*) ;;
              *) echo "::error::CI run $RUN holds no $a artifact to publish"; exit 1 ;;
            esac
          done
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
      - id: release
        if: steps.pending.outputs.pr != ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # The release PR, from main as it stands: on every push, and again
  # after a release, as a pending release PR holds back the next one.
  pull-request:
    needs: release
    if: >-
      always() && (github.event_name == 'push' ||
      needs.release.outputs.release_created == 'true' ||
      needs.release.outputs.bridge_release_created == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-please-pull-request
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # What to publish, from which CI run: the releases just cut, or the tag
  # and run given by hand, checked as the release job checks them.
  plan:
    needs: release
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      needs.release.outputs.release_created == 'true' ||
      needs.release.outputs.bridge_release_created == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.plan.outputs.run_id }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      bridge_tag: ${{ steps.plan.outputs.bridge_tag }}
      bridge_version: ${{ steps.plan.outputs.bridge_version }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASED: ${{ needs.release.outputs.release_created == 'true' && needs.release.outputs.tag_name || '' }}
          BRIDGE_RELEASED: ${{ needs.release.outputs.bridge_release_created == 'true' && needs.release.outputs.bridge_tag_name || '' }}
          WR_RUN: ${{ github.event.workflow_run.id }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RUN: ${{ inputs.run-id }}
        run: |
          set -o pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            run=$INPUT_RUN
            tags=$INPUT_TAG
          else
            run=$WR_RUN
            tags="$RELEASED $BRIDGE_RELEASED"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
            -q '[.path, .event, .head_branch, .conclusion, .head_repository.full_name, .head_sha] | join(" ")' > run.txt
          read -r path event branch conclusion repo sha < run.txt
          test "$path $event $branch $conclusion $repo" = ".github/workflows/ci.yml push main success $GITHUB_REPOSITORY"
          echo "run_id=$run" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          for tag in $tags; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" -q .sha)" = "$sha"
            case $tag in
              faderz-bridge-v*) echo "bridge_tag=$tag" "bridge_version=${tag#faderz-bridge-v}" ;;
              v*) echo "tag=$tag" "version=${tag#v}" ;;
              *) echo "::error::$tag is no release tag of this repository"; exit 1 ;;
            esac | tr ' ' '\n' >> "$GITHUB_OUTPUT"
          done
          cat "$GITHUB_OUTPUT"

  # Tags pushed by this workflow trigger no tag workflows, so publishing
  # runs here, on the release it just created, from the image the CI run
  # of the tagged commit built.
  image:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - name: Check the tag is the commit CI passed on and carries the release version
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          grep -qx "version = \"$VERSION\"" Cargo.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faderz-image
          run-id: ${{ needs.plan.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Load the image and check its version and revision
        run: |
          docker load -i faderz-image.tar
          docker run --rm faderz:ci --version | grep -qx "faderz $VERSION"
          test "$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' faderz:ci)" = "$SHA"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the image
        run: |
          docker tag faderz:ci "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION" | tee push.log
          digest=$(grep -o 'digest: sha256:[0-9a-f]\{64\}' push.log | cut -d' ' -f2)
          test -n "$digest"
          echo "PUSHED=$IMAGE@$digest" >> "$GITHUB_ENV"
      # Workflow logs are no evidence the published artefact is right.
      - name: Pull the published image and start it
        run: |
          docker rmi "$IMAGE:$VERSION" faderz:ci
          docker pull "$PUSHED"
          docker pull "$IMAGE:$VERSION"
          test "$(docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")" = "$PUSHED"
          docker run --rm "$PUSHED" --version | grep -qx "faderz $VERSION"
          docker/smoke.sh "$PUSHED"

  # The binary for standalone use, taken from the published image, so the
  # asset and the image carry one build.
  binary:
    needs: [plan, image]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attach the binary, its licences and their SHA-256 sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cd dist
          id=$(docker create "$IMAGE:$VERSION")
          docker cp "$id:/usr/local/bin/faderz" "faderz-$VERSION-x86_64-linux"
          docker cp "$id:/usr/share/licenses/faderz/LICENSE" "faderz-$VERSION-LICENSE"
          docker cp "$id:/usr/share/licenses/faderz/THIRD-PARTY.txt" "faderz-$VERSION-THIRD-PARTY.txt"
          docker cp "$id:/usr/share/licenses/faderz/THIRD-PARTY-WEB.txt" "faderz-$VERSION-THIRD-PARTY-WEB.txt"
          docker rm "$id"
          test "$("./faderz-$VERSION-x86_64-linux" --version)" = "faderz $VERSION"
          sha256sum "faderz-$VERSION-"* > "faderz-$VERSION-SHA256SUMS"
          gh release upload --clobber "$TAG" "faderz-$VERSION-"* --repo "$GITHUB_REPOSITORY"
      # Workflow logs are no evidence the published artefact is right.
      - name: Download the attached files and check their sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published
          cd published
          gh release download "$TAG" --pattern "faderz-$VERSION-*" --repo "$GITHUB_REPOSITORY"
          sha256sum -c "faderz-$VERSION-SHA256SUMS"
          chmod +x "faderz-$VERSION-x86_64-linux"
          test "$("./faderz-$VERSION-x86_64-linux" --version)" = "faderz $VERSION"

  bridge-image:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.bridge_tag != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.bridge_version }}
      SHA: ${{ needs.plan.outputs.sha }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/faderz-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.bridge_tag }}
          persist-credentials: false
      - name: Check the tag is the commit CI passed on and carries the release version
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          grep -qx "version = \"$VERSION\"" bridge/Cargo.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faderz-bridge-image
          run-id: ${{ needs.plan.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Load the image and check its version and revision
        run: |
          docker load -i faderz-bridge-image.tar
          docker run --rm faderz-bridge:ci --version | grep -qx "faderz-bridge $VERSION"
          test "$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' faderz-bridge:ci)" = "$SHA"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the image
        run: |
          docker tag faderz-bridge:ci "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION" | tee push.log
          digest=$(grep -o 'digest: sha256:[0-9a-f]\{64\}' push.log | cut -d' ' -f2)
          test -n "$digest"
          echo "PUSHED=$IMAGE@$digest" >> "$GITHUB_ENV"
      # Workflow logs are no evidence the published artefact is right.
      - name: Pull the published image and start it
        run: |
          docker rmi "$IMAGE:$VERSION" faderz-bridge:ci
          docker pull "$PUSHED"
          docker pull "$IMAGE:$VERSION"
          test "$(docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")" = "$PUSHED"
          docker run --rm "$PUSHED" --version | grep -qx "faderz-bridge $VERSION"

  # The binary for standalone use, taken from the published image, so the
  # asset and the image carry one build.
  bridge-binary:
    needs: [plan, bridge-image]
    if: ${{ !cancelled() && needs.bridge-image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ needs.plan.outputs.bridge_version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/faderz-bridge
      TAG: ${{ needs.plan.outputs.bridge_tag }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attach the binary, its licences and their SHA-256 sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cd dist
          id=$(docker create "$IMAGE:$VERSION")
          docker cp "$id:/usr/local/bin/faderz-bridge" "faderz-bridge-$VERSION-x86_64-linux"
          docker cp "$id:/usr/share/licenses/faderz-bridge/LICENSE" "faderz-bridge-$VERSION-LICENSE"
          docker cp "$id:/usr/share/licenses/faderz-bridge/THIRD-PARTY.txt" "faderz-bridge-$VERSION-THIRD-PARTY.txt"
          docker rm "$id"
          sha256sum "faderz-bridge-$VERSION-"* > "faderz-bridge-$VERSION-SHA256SUMS"
          gh release upload --clobber "$TAG" "faderz-bridge-$VERSION-"* --repo "$GITHUB_REPOSITORY"
      # Workflow logs are no evidence the published artefact is right.
      - name: Download the attached files and check their sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published
          cd published
          gh release download "$TAG" --pattern "faderz-bridge-$VERSION-*" --repo "$GITHUB_REPOSITORY"
          sha256sum -c "faderz-bridge-$VERSION-SHA256SUMS"
          chmod +x "faderz-bridge-$VERSION-x86_64-linux"
          test "$("./faderz-bridge-$VERSION-x86_64-linux" --version)" = "faderz-bridge $VERSION"
