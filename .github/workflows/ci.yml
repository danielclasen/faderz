name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILDER: ghcr.io/danielclasen/samplez-builder@sha256:92ece4452be98fff177b49fb201c8c693130c08845c42725dd5b1173d4863fba

# The cargo caches hold dependencies only: faderz itself is rebuilt on
# every checkout anyway (its sources are newer than any cached output),
# so it is cleaned out before a save. They are saved from main only, so
# per-PR snapshots do not evict the main caches from the shared Actions
# cache.
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: cargo-rust-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-${{ github.sha }}
          restore-keys: |
            cargo-rust-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-
            cargo-rust-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The binary carries the UI it is built with.
      - run: npm run build
        working-directory: web
      - name: Format, lint and test in the builder image
        run: |
          mkdir -p .cargo-registry .cargo-git
          docker run --rm --user "$(id -u):$(id -g)" -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w "$BUILDER" bash -euo pipefail -c '
              cargo fmt --all --check
              cargo clippy --all-targets --locked -- -D warnings
              cargo test --locked
            '
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Clean faderz out of the cache
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w "$BUILDER" cargo clean --locked -p faderz
          du -sh target .cargo-registry .cargo-git
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: cargo-rust-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-${{ github.sha }}

  # The bridge is a crate of its own in bridge/, with its own lock file.
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bridge/target
            .cargo-registry
            .cargo-git
          key: cargo-bridge-${{ hashFiles('bridge/Cargo.lock') }}-${{ env.BUILDER }}-${{ github.sha }}
          restore-keys: |
            cargo-bridge-${{ hashFiles('bridge/Cargo.lock') }}-${{ env.BUILDER }}-
            cargo-bridge-
      - name: Format, lint and test the bridge in the builder image
        run: |
          mkdir -p .cargo-registry .cargo-git
          docker run --rm --user "$(id -u):$(id -g)" -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w/bridge "$BUILDER" bash -euo pipefail -c '
              cargo fmt --check
              cargo clippy --all-targets --locked -- -D warnings
              cargo test --locked
            '
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Clean the bridge out of the cache
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w/bridge "$BUILDER" cargo clean --locked -p faderz-bridge
          du -sh bridge/target .cargo-registry .cargo-git
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bridge/target
            .cargo-registry
            .cargo-git
          key: cargo-bridge-${{ hashFiles('bridge/Cargo.lock') }}-${{ env.BUILDER }}-${{ github.sha }}

  bridge-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check advisories, licences, bans and sources of the bridge's crates
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: bridge/Cargo.toml

  bridge-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: bridge/Dockerfile
          load: true
          tags: faderz-bridge:ci
          cache-from: type=gha,scope=bridge-image
          cache-to: type=gha,scope=bridge-image,mode=max
      - name: Start the image and check its licences
        run: |
          docker run --rm faderz-bridge:ci --version | grep -q '^faderz-bridge '
          id=$(docker create faderz-bridge:ci)
          docker cp "$id:/usr/share/licenses/faderz-bridge" licenses
          docker rm "$id"
          cmp licenses/LICENSE LICENSE
          test -s licenses/THIRD-PARTY.txt

  # The debug binary the backend suites run against, checked against
  # the contract here and handed to them as an artifact.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: cargo-build-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-${{ github.sha }}
          restore-keys: |
            cargo-build-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-
            cargo-build-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The binary carries the UI it is built with.
      - run: npm run build
        working-directory: web
      - name: Build in the builder image
        run: |
          mkdir -p .cargo-registry .cargo-git
          docker run --rm --user "$(id -u):$(id -g)" -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w "$BUILDER" cargo build --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faderz-debug
          path: target/debug/faderz
          retention-days: 1
      - name: Check the backend against the contract
        run: npm run test:backend
        working-directory: web
        env:
          FADERZ_BIN: ../target/debug/faderz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Clean faderz out of the cache
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w "$BUILDER" cargo clean --locked -p faderz
          du -sh target .cargo-registry .cargo-git
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: cargo-build-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-${{ github.sha }}

  # The e2e suite against the backend in three shards, and the UI from
  # the binary in each auth mode, each on a runner of its own with a
  # backend of its own. Every shard starts from the global setup's state.
  backend:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e-1
            run: FADERZ_E2E_BACKEND=../target/debug/faderz npx playwright test --shard=1/3
          - name: e2e-2
            run: FADERZ_E2E_BACKEND=../target/debug/faderz npx playwright test --shard=2/3
          - name: e2e-3
            run: FADERZ_E2E_BACKEND=../target/debug/faderz npx playwright test --shard=3/3
          - name: binary
            run: FADERZ_BIN=../target/debug/faderz npm run test:binary
    name: backend (${{ matrix.name }})
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faderz-debug
          path: target/debug
      - run: chmod +x ../target/debug/faderz
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Run against the backend
        run: ${{ matrix.run }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-backend-${{ matrix.name }}
          path: |
            web/playwright-report/
            web/playwright-report-binary/
            web/test-results/
          retention-days: 14

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check advisories, licences, bans and sources of the Rust crates
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: faderz:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Start the image and check it serves, refuses and persists
        run: docker/smoke.sh faderz:ci
      - name: Build the release binary
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dist
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=image
      - name: Check the release binary runs here
        run: |
          test -s dist/THIRD-PARTY.txt
          cmp dist/LICENSE LICENSE
          grep -q '^svelte ' dist/THIRD-PARTY-WEB.txt
          grep -q 'SIL OPEN FONT LICENSE' dist/THIRD-PARTY-WEB.txt
          if grep -E '&(quot|amp|lt|gt|#x[0-9a-fA-F]+);' dist/THIRD-PARTY.txt; then
            echo "::error::THIRD-PARTY.txt contains HTML entities"
            exit 1
          fi
          dist/faderz --version | grep -q '^faderz '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faderz-release
          path: dist/faderz
          retention-days: 1

  # The release checks the attached binary against the published
  # image's byte for byte; they come from separate builds on
  # separate runners, so two builds of one source have to agree. This
  # build runs without any cache on a runner of its own, in parallel with
  # the image job's.
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the release binary again
        run: |
          touch web/src/main.ts LICENSE
          docker buildx build --no-cache --target dist --output type=local,dest=dist-again .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faderz-release-again
          path: dist-again/faderz
          retention-days: 1

  reproducible:
    needs: [image, rebuild]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faderz-release
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faderz-release-again
          path: dist-again
      - name: Compare the two release binaries
        run: cmp dist/faderz dist-again/faderz

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The e2e suite against the mock in three shards, each on a runner of
  # its own with dev servers of its own; every test resets the mock.
  web-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - id: playwright
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Saved from main only, as the cargo caches.
      - if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          matrix.shard == '1/3' && steps.playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright test --shard=${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
