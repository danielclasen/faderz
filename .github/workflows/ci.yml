name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run it supersedes. Every run
# on main completes: a release waits for its commit's run to pass
# (release-please.yml).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUILDER: ghcr.io/danielclasen/samplez-builder@sha256:92ece4452be98fff177b49fb201c8c693130c08845c42725dd5b1173d4863fba

# Every job's timeout is about twice its longest normal run, a run on
# main that builds its cargo cache from nothing included, so a hung job
# fails within minutes rather than at the 6 h default.
#
# The cargo caches hold dependencies only: faderz itself is rebuilt on
# every checkout anyway (its sources are newer than any cached output),
# so it is cleaned out before a save. Their key is the lock file and the
# builder, so main saves one only when either changes and a run on any
# other commit restores it whole; pull requests never save one. A pull
# request that changes the lock file starts from the last cache saved;
# main then builds from nothing, so no saved cache carries the build
# output of dependencies the lock file no longer names.
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: cargo-rust-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'cargo-rust-' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The binary carries the UI it is built with.
      - run: npm run build
        working-directory: web
      - name: Format, lint and test in the builder image
        run: |
          mkdir -p .cargo-registry .cargo-git
          docker run --rm --user "$(id -u):$(id -g)" -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w "$BUILDER" bash -euo pipefail -c '
              cargo fmt --all --check
              cargo clippy --all-targets --locked -- -D warnings
              cargo test --locked
              cargo test --release --locked --test set_audio
              cargo test --release --locked --test set_nmos
            '
      - if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.cache.outputs.cache-hit != 'true'
        name: Clean faderz out of the cache
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w "$BUILDER" cargo clean --locked -p faderz
          du -sh target .cargo-registry .cargo-git
      - if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The debug binary the backend suites run against, checked against
  # the contract here and handed to them as an artifact.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: cargo-build-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'cargo-build-' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The binary carries the UI it is built with.
      - run: npm run build
        working-directory: web
      - name: Build in the builder image
        run: |
          mkdir -p .cargo-registry .cargo-git
          docker run --rm --user "$(id -u):$(id -g)" -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w "$BUILDER" cargo build --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faderz-debug
          path: target/debug/faderz
          retention-days: 1
          overwrite: true
      - name: Check the backend against the contract
        run: npm run test:backend
        working-directory: web
        env:
          FADERZ_BIN: ../target/debug/faderz
      - if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.cache.outputs.cache-hit != 'true'
        name: Clean faderz out of the cache
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w "$BUILDER" cargo clean --locked -p faderz
          du -sh target .cargo-registry .cargo-git
      - if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The bridge is a crate of its own in bridge/, with its own lock file.
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bridge/target
            .cargo-registry
            .cargo-git
          key: cargo-bridge-${{ hashFiles('bridge/Cargo.lock') }}-${{ env.BUILDER }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'cargo-bridge-' || '' }}
      # midir builds against ALSA, which the builder image lacks: the
      # container installs its headers as root and hands what it wrote
      # back to the runner's user.
      - name: Format, lint and test the bridge in the builder image
        run: |
          mkdir -p .cargo-registry .cargo-git
          docker run --rm -e CARGO_INCREMENTAL=0 -e OWNER="$(id -u):$(id -g)" \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w/bridge "$BUILDER" bash -euo pipefail -c '
              trap "chown -R \$OWNER /w/bridge /usr/local/cargo/registry /usr/local/cargo/git" EXIT
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends libasound2-dev pkg-config >/dev/null
              cargo fmt --check
              cargo clippy --all-targets --all-features --locked -- -D warnings
              cargo test --locked
            '
      - if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.cache.outputs.cache-hit != 'true'
        name: Clean the bridge out of the cache
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w/bridge "$BUILDER" cargo clean --locked -p faderz-bridge
          du -sh bridge/target .cargo-registry .cargo-git
      - if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bridge/target
            .cargo-registry
            .cargo-git
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The bridge with two emulated units against the faderz debug binary
  # the build job checked against the contract, with every test feature;
  # the RTP-MIDI interop tests run against rtpmidid.
  bridge-e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RTPMIDID_DEB: https://github.com/davidmoreno/rtpmidid/releases/download/v26.01/rtpmidid-debian-trixie-amd64-26.01.deb
      RTPMIDID_SHA256: 3e8066e337336a52f290548f994a81920dece66770f574b8d18716d99659bf56
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faderz-debug
          path: target/debug
      - run: chmod +x target/debug/faderz
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bridge/target
            .cargo-registry
            .cargo-git
          key: cargo-bridge-${{ hashFiles('bridge/Cargo.lock') }}-${{ env.BUILDER }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'cargo-bridge-' || '' }}
      - name: Fetch rtpmidid
        run: |
          curl -fsSL --retry 5 -o rtpmidid.deb "$RTPMIDID_DEB"
          echo "$RTPMIDID_SHA256  rtpmidid.deb" | sha256sum -c -
      - name: Run the bridge against faderz in the builder image
        run: |
          mkdir -p .cargo-registry .cargo-git
          docker run --rm -e CARGO_INCREMENTAL=0 -e FADERZ_BIN=/w/target/debug/faderz \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w/bridge "$BUILDER" bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends libasound2-dev pkg-config /w/rtpmidid.deb >/dev/null
              cargo test --locked --all-features
            '

  # Advisories, licences, bans and sources of both crates' dependencies.
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the faderz crates
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - name: Check the bridge's crates
        if: ${{ !cancelled() }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: bridge/Cargo.toml

  # The image a release publishes: built and checked here, and on main
  # kept as an artifact that release-please.yml pushes once this run has
  # passed, so the published image is the one these checks ran on.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the package version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: faderz:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Start the image and check it serves, refuses and persists
        run: docker/smoke.sh faderz:ci
      # A release attaches the binary and its notices as they are in the
      # image; they have to run and read right outside it.
      - name: Check the binary and its notices outside the image
        run: |
          docker run --rm faderz:ci --version | grep -qx "faderz $VERSION"
          id=$(docker create faderz:ci)
          docker cp "$id:/usr/local/bin/faderz" faderz
          docker cp "$id:/usr/share/licenses/faderz" licenses
          docker rm "$id"
          ./faderz --version | grep -qx "faderz $VERSION"
          cmp licenses/LICENSE LICENSE
          test -s licenses/THIRD-PARTY.txt
          grep -q '^svelte ' licenses/THIRD-PARTY-WEB.txt
          grep -q 'SIL OPEN FONT LICENSE' licenses/THIRD-PARTY-WEB.txt
          if grep -E '&(quot|amp|lt|gt|#x[0-9a-fA-F]+);' licenses/THIRD-PARTY.txt; then
            echo "::error::THIRD-PARTY.txt contains HTML entities"
            exit 1
          fi
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save -o faderz-image.tar faderz:ci
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faderz-image
          path: faderz-image.tar
          retention-days: 7
          overwrite: true

  bridge-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the package version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' bridge/Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: bridge/Dockerfile
          load: true
          tags: faderz-bridge:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=bridge-image
          cache-to: type=gha,scope=bridge-image,mode=max
      - name: Start the image and check its licences
        run: |
          docker run --rm faderz-bridge:ci --version | grep -qx "faderz-bridge $VERSION"
          id=$(docker create faderz-bridge:ci)
          docker cp "$id:/usr/share/licenses/faderz-bridge" licenses
          docker rm "$id"
          cmp licenses/LICENSE LICENSE
          test -s licenses/THIRD-PARTY.txt
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save -o faderz-bridge-image.tar faderz-bridge:ci
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faderz-bridge-image
          path: faderz-bridge-image.tar
          retention-days: 7
          overwrite: true

  # The e2e suite against the mock in three shards, each on a runner of
  # its own with dev servers of its own; every test resets the mock. It
  # starts once the type checks and unit tests have passed.
  web-e2e:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Chromium and its system libraries at the version of @playwright/test
    # in web/package-lock.json; the two move together.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      # Chromium's shared memory is the host's, not the container's 64 MB.
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright test --shard=${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  # The e2e suite against the backend in three shards, and the UI from
  # the binary in each auth mode beside the shortest shard, each on a
  # runner of its own with a backend of its own. Every shard starts from
  # the global setup's state.
  backend:
    needs: [web, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e-1
            run: FADERZ_E2E_BACKEND=../target/debug/faderz npx playwright test --shard=1/3
          - name: e2e-2
            run: FADERZ_E2E_BACKEND=../target/debug/faderz npx playwright test --shard=2/3
            binary: true
          - name: e2e-3
            run: FADERZ_E2E_BACKEND=../target/debug/faderz npx playwright test --shard=3/3
    name: backend (${{ matrix.name }})
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faderz-debug
          path: target/debug
      - run: chmod +x ../target/debug/faderz
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run against the backend
        run: ${{ matrix.run }}
      - name: Run the UI from the binary in each auth mode
        if: ${{ !cancelled() && matrix.binary }}
        run: npm run test:binary
        env:
          FADERZ_BIN: ../target/debug/faderz
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-backend-${{ matrix.name }}
          path: |
            web/playwright-report/
            web/playwright-report-binary/
            web/test-results/
          retention-days: 14

  # The AMWA nmos-testing node suites against the image: IS-04-01 with
  # unicast and with multicast DNS-SD, IS-05-01 and BCP-007-03-01, each
  # against a freshly started faderz. tests/nmos/gate.py fails on any
  # result not Pass that tests/nmos/expected.json does not list with its
  # reason.
  nmos:
    runs-on: ubuntu-24.04
    # Twice a run with an uncached faderz image, plus the wait for an
    # image a pull request publishes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: faderz:nmos
          cache-from: type=gha,scope=image
      # Published by nmos-testing-image.yml for the pinned commit. A pull
      # request that changes the pin publishes the image in a run of its
      # own, which this waits for, up to 20 min. The tag is resolved to a
      # digest once, pulled by it, and checked to carry the pin as its
      # revision.
      - name: Pull the nmos-testing image
        run: |
          ref=$(cat .github/nmos-testing.ref)
          repo=ghcr.io/${GITHUB_REPOSITORY_OWNER}/faderz-nmos-testing
          deadline=$((SECONDS + 1200))
          until digest=$(docker buildx imagetools inspect "$repo:$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest); do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$repo:$ref is not published; nmos-testing-image.yml publishes it"
              exit 1
            fi
            echo "waiting for $repo:$ref"
            sleep 30
          done
          docker pull "$repo@$digest"
          test "$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$repo@$digest")" = "$ref"
          docker tag "$repo@$digest" nmos-testing:ci
      # faderz reads CLOCK_TAI, the tool computes TAI from UTC: absolute
      # activations meet only with the kernel's TAI offset set.
      - name: Set the kernel TAI offset
        run: sudo python3 tests/nmos/set-tai-offset.py 37
      # About three times the suites' usual run, so a hung suite fails here.
      - name: Run the suites
        timeout-minutes: 8
        run: tests/nmos/conformance.sh faderz:nmos nmos-testing:ci nmos-results
      - name: Gate on the results
        run: |
          python3 -B -m unittest tests/nmos/test_gate.py
          python3 tests/nmos/gate.py tests/nmos/expected.json nmos-results
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nmos-testing-results
          path: nmos-results

  # One check for branch protection to require, whatever the jobs above
  # are named or sharded into: it passes only when every one of them did.
  ci:
    if: always()
    needs: [web, rust, build, bridge, bridge-e2e, deny, image, bridge-image, web-e2e, backend, nmos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do test "$r" = success; done
