name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILDER: ghcr.io/danielclasen/samplez-builder@sha256:92ece4452be98fff177b49fb201c8c693130c08845c42725dd5b1173d4863fba

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: cargo-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-
            cargo-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The binary carries the UI it is built with.
      - run: npm run build
        working-directory: web
      - name: Format, lint, test and build in the builder image
        run: |
          mkdir -p .cargo-registry .cargo-git
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w "$BUILDER" bash -euo pipefail -c '
              cargo fmt --all --check
              cargo clippy --all-targets --locked -- -D warnings
              cargo test --locked
              cargo build --locked
            '
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Check the backend against the contract
        run: npm run test:backend
        working-directory: web
        env:
          FADERZ_BIN: ../target/debug/faderz
      - name: Run the e2e suite against the backend
        run: npx playwright test
        working-directory: web
        env:
          FADERZ_E2E_BACKEND: ../target/debug/faderz
      - name: Run the UI from the binary in each auth mode
        run: npm run test:binary
        working-directory: web
        env:
          FADERZ_BIN: ../target/debug/faderz
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-backend
          path: |
            web/playwright-report/
            web/playwright-report-binary/
            web/test-results/
          retention-days: 14
      # Saved from main only, so per-PR snapshots do not evict the main
      # cache from the shared Actions cache.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: cargo-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-${{ github.sha }}

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check advisories, licences, bans and sources of the Rust crates
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: faderz:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Start the image and check it serves, refuses and persists
        run: docker/smoke.sh faderz:ci
      - name: Build the release binary
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dist
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=image
      - name: Check the release binary runs here
        run: |
          test -s dist/THIRD-PARTY.txt
          grep -q '^svelte ' dist/THIRD-PARTY-WEB.txt
          grep -q 'SIL OPEN FONT LICENSE' dist/THIRD-PARTY-WEB.txt
          if grep -E '&(quot|amp|lt|gt|#x[0-9a-fA-F]+);' dist/THIRD-PARTY.txt; then
            echo "::error::THIRD-PARTY.txt contains HTML entities"
            exit 1
          fi
          dist/faderz --version | grep -q '^faderz '

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
