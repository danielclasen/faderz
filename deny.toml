# cargo-deny: advisories, licences, bans and sources of the Rust crates
# in the binary. The licences are the ones about.toml accepts.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
exclude-dev = true

[advisories]
yanked = "deny"
ignore = [
  # chrono is unmaintained, with no patched version. It comes in only
  # through openraft 0.9, which samplez-replica is built on; nothing here
  # calls it.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, no patched version; only via openraft" },
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
# Every dependency names its version: registry ones and the samplez git
# ones, pinned by rev, with `=`.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# samplez-mxl takes libmxl's Rust bindings from the MXL repository at a
# pinned rev.
allow-git = [
  "https://github.com/danielclasen/samplez",
  "https://github.com/dmf-mxl/mxl",
]
