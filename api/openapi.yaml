openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: faderz API
  version: 1.0.0
  summary: Operated broadcast multichannel mixer.
  description: |
    REST reads and writes of the faderz mixer, plus one WebSocket at
    /api/v1/ws. Shared types live in ws/model.schema.json; WebSocket
    messages in ws/client-message.schema.json and
    ws/server-message.schema.json.

    faderz runs as one or more replicas sharing one replicated state with a
    global revision. Any replica serves any request. Writes carry a
    client-generated command id; a command id is applied at most once
    across all replicas, so a client resends it to another replica after a
    failover. Parameter changes take effect at a sample index chosen by the
    system (atIndex), the same on every replica. The server batches the
    commands arriving within one processing block into one log entry, so
    one revision may carry changes of several commands. A write is answered
    once the log entry carrying it has committed, and a read returns the
    state at a committed revision. A write the serving replica cannot commit
    is answered 503: it was not applied when the answer was sent. It may
    still be applied later, at most once, when it was proposed before the
    replica gave up waiting for it to commit. Sending the request again with
    the same commandId settles it: the answer is then the command's one
    outcome, duplicate with the revision it was applied at if it was, or the
    result of applying it now.

    WebSocket clients keep a primary connection and a standby connection
    to another replica, exchange heartbeats every 250 ms on both and fail
    over to the standby when the primary is lost or its replica reports
    that it cannot commit. Touch ownership belongs to a session (owner
    record: principal, the session's owner handle, kind, connection) and lapses 2 s after the
    session's last message through any replica not partitioned from the
    quorum. Meters arrive on the primary connection as binary frames,
    paced by credits the client grants.

    State-changing requests without a bearer token need the header
    `X-Samplez-Request: 1` and `Content-Type: application/json`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
# None in none and proxy mode, where the proxy in front authenticates.
security:
  - {}
  - bearer: []
  - session: []
paths:
  /state:
    get:
      operationId: getState
      summary: Read shape, live state, owners and the global revision.
      responses:
        "200":
          description: Current state.
          content:
            application/json:
              schema:
                $ref: "./ws/model.schema.json#/$defs/StateDocument"
    patch:
      operationId: patchState
      summary: Write one or more controls atomically.
      description: |
        All changes apply in one revision, or none does. A change to a
        control owned by a session (touch) is refused with 409 and the
        current value and owner of every owned control in the request.

        Duck groups are written here like any other control, under
        `/ducks/{duckId}/`: one boolean per trigger, target and
        destination, so a preset is one request. A change that would
        make a channel trigger and target of one group, or give a group
        more than 8 triggers, is refused with 400, as is `hold: true`:
        the hold is momentary, and only a WebSocket session that touched
        it sets it.
      parameters:
        - $ref: "#/components/parameters/RequestHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commandId, changes]
              additionalProperties: false
              properties:
                commandId:
                  $ref: "./ws/model.schema.json#/$defs/CommandId"
                changes:
                  type: array
                  minItems: 1
                  items:
                    $ref: "./ws/model.schema.json#/$defs/Change"
            examples:
              latchDuck:
                summary: Latch a duck group in.
                value:
                  commandId: 0b6b2c2e-7d1f-4a3c-9a55-0f5c1d8e2b41
                  changes:
                    - { path: /ducks/comm/mode, value: "on" }
              duckSetup:
                summary: Duck the ambience under the commentator by 15 dB.
                value:
                  commandId: 5d0c9a1e-3b7f-4e2a-8c61-2f4b9d7e1a03
                  changes:
                    - { path: /ducks/comm/channels/comm1/trigger, value: true }
                    - { path: /ducks/comm/channels/amb/target, value: true }
                    - { path: /ducks/comm/channels/amb/depth, value: 15 }
                    - { path: /ducks/comm/attackMs, value: 20 }
                    - { path: /ducks/comm/releaseMs, value: 1000 }
      responses:
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/NotApplied"
        "200":
          $ref: "#/components/responses/CommandResult"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Conflict"
  /replicas:
    get:
      operationId: getReplicas
      summary: Replica set as seen by the serving replica.
      responses:
        "200":
          description: Replicas.
          content:
            application/json:
              schema:
                type: object
                required: [replica, replicas]
                additionalProperties: false
                properties:
                  replica:
                    $ref: "./ws/model.schema.json#/$defs/ReplicaRef"
                  replicas:
                    type: array
                    minItems: 1
                    items:
                      $ref: "./ws/model.schema.json#/$defs/ReplicaStatus"
  /scenes:
    post:
      operationId: createScene
      summary: Store the current state as a new scene.
      parameters:
        - $ref: "#/components/parameters/RequestHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commandId, name]
              additionalProperties: false
              properties:
                commandId:
                  $ref: "./ws/model.schema.json#/$defs/CommandId"
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/NotApplied"
        "201":
          $ref: "#/components/responses/SceneResult"
        "400":
          $ref: "#/components/responses/Error"
  /scenes/{sceneId}:
    parameters:
      - $ref: "#/components/parameters/SceneId"
    put:
      operationId: storeScene
      summary: Store the current state into an existing scene, optionally renaming it.
      parameters:
        - $ref: "#/components/parameters/RequestHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commandId]
              additionalProperties: false
              properties:
                commandId:
                  $ref: "./ws/model.schema.json#/$defs/CommandId"
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/NotApplied"
        "200":
          $ref: "#/components/responses/SceneResult"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteScene
      summary: Delete a scene.
      parameters:
        - $ref: "#/components/parameters/RequestHeader"
      responses:
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/NotApplied"
        "200":
          $ref: "#/components/responses/CommandResult"
        "404":
          $ref: "#/components/responses/Error"
  /scenes/{sceneId}/recall:
    parameters:
      - $ref: "#/components/parameters/SceneId"
    post:
      operationId: recallScene
      summary: Recall a scene with a crossfade.
      description: |
        Applies the scene to every control, owned ones included, except the
        recall-safe parameter groups. The state takes the scene values at
        once; the audio crossfades over crossfadeMs from atIndex.
      parameters:
        - $ref: "#/components/parameters/RequestHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commandId, crossfadeMs]
              additionalProperties: false
              properties:
                commandId:
                  $ref: "./ws/model.schema.json#/$defs/CommandId"
                crossfadeMs:
                  type: integer
                  minimum: 0
                  maximum: 60000
      responses:
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/NotApplied"
        "200":
          $ref: "#/components/responses/CommandResult"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /afv/tally:
    post:
      operationId: postTally
      summary: Tally change of one source.
      description: |
        preview has no audio effect. A tally whose atIndex or at lies in the
        past applies at the next block and counts in afv_late_total.
      parameters:
        - $ref: "#/components/parameters/RequestHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, state]
              additionalProperties: false
              properties:
                source:
                  $ref: "./ws/model.schema.json#/$defs/TallySource"
                state:
                  $ref: "./ws/model.schema.json#/$defs/TallyState"
                atIndex:
                  $ref: "./ws/model.schema.json#/$defs/SampleIndex"
                at:
                  description: TAI time at which the tally takes effect.
                  type: string
                  format: date-time
                transitionMs:
                  description: Ramp time of this transition in both directions, in place of the riseMs and fallMs of each binding to this source.
                  type: integer
                  minimum: 0
                  maximum: 10000
      responses:
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/NotApplied"
        "200":
          $ref: "#/components/responses/CommandResult"
        "400":
          $ref: "#/components/responses/Error"
    put:
      operationId: putTally
      summary: Replace the full tally state, so a sender resyncs after downtime.
      parameters:
        - $ref: "#/components/parameters/RequestHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sources]
              additionalProperties: false
              properties:
                sources:
                  type: object
                  propertyNames:
                    $ref: "./ws/model.schema.json#/$defs/TallySource"
                  additionalProperties:
                    $ref: "./ws/model.schema.json#/$defs/TallyState"
      responses:
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/NotApplied"
        "200":
          $ref: "#/components/responses/CommandResult"
        "400":
          $ref: "#/components/responses/Error"
  /loudness/reset:
    post:
      operationId: resetLoudness
      summary: Reset integrated loudness and LRA of buses, auxes or mix-minus outputs.
      description: |
        Restarts the measurement of each output: integrated loudness, LRA
        and the momentary and short-term maxima. A paused measurement stays
        paused; start and pause are writes of /loudness/{id}/running
        (model.schema.json LoudnessMeasurement).
      parameters:
        - $ref: "#/components/parameters/RequestHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              additionalProperties: false
              properties:
                ids:
                  $ref: "./ws/model.schema.json#/$defs/IdSet"
      responses:
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/NotApplied"
        "204":
          description: Reset.
        "404":
          $ref: "#/components/responses/Error"
  /consoles:
    get:
      operationId: getConsoles
      summary: Read the consoles, as the state's /consoles carries them.
      responses:
        "200":
          description: Consoles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./ws/model.schema.json#/$defs/ConsoleStatus"
  /consoles/{consoleId}:
    parameters:
      - $ref: "#/components/parameters/ConsoleId"
    put:
      operationId: putConsole
      summary: Create a console or update its descriptor.
      description: |
        Keeps the console's handle, connected and bankOffset, which its
        registering session sets (ws/client-message.schema.json Console).
        A field left out keeps its value, or takes its default on a new
        console: protocol mcu, transport bridge, strips 8. A declared
        console keeps the name of the configuration. Answered with the
        console's status, 201 when it was created. At most 64 consoles
        besides the declared ones.
      parameters:
        - $ref: "#/components/parameters/RequestHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                protocol:
                  type: string
                  enum: [mcu, hui, osc]
                transport:
                  type: string
                  enum: [alsa-midi, bridge, osc-udp]
                strips:
                  type: integer
                  minimum: 1
      responses:
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/NotApplied"
        "200":
          $ref: "#/components/responses/Console"
        "201":
          $ref: "#/components/responses/Console"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          description: The console was removed between the update and the answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteConsole
      summary: Remove a console that is not declared in the configuration.
      description: |
        Refused with 409 for a declared console, and for one connected to a
        session (ConsoleStatus.connected), which its next registration
        would bring back; it can be removed once that session's lease has
        expired.
      parameters:
        - $ref: "#/components/parameters/RequestHeader"
      responses:
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/NotApplied"
        "204":
          description: Removed.
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The console is declared in the configuration, or connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ws:
    get:
      operationId: openWebSocket
      summary: WebSocket upgrade for commands, deltas, meters and counters.
      description: |
        Client messages: ws/client-message.schema.json. Server messages:
        ws/server-message.schema.json, JSON text messages except the
        binary meter frames of its $defs/MeterFrame. The first client
        message is hello.
        The Origin header must be in api.allowedOrigins. A connection
        opened with a session cookie or an access token is closed with
        code 1008 when the session expires or is signed out, or the token
        expires.
      parameters:
        - name: session
          in: query
          required: true
          description: Session id of the client (model SessionId), the same on every connection of the session, including the standby connection and every reconnect.
          schema:
            $ref: "./ws/model.schema.json#/$defs/SessionId"
      responses:
        "101":
          description: Switching protocols.
        "400":
          description: session missing or not a SessionId.
        "403":
          description: Origin not allowed.
  /session:
    get:
      operationId: getSession
      summary: The auth mode and who the request is signed in as.
      description: |
        Answered without credentials as well, with role null when the
        request is not signed in: in oidc mode a client signs in at
        GET /login, in token mode with POST /login.
      security: [{}]
      responses:
        "200":
          description: The mode and the identity, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: Host not allowed.
  /login:
    post:
      operationId: logIn
      summary: Exchange the API token for a session cookie; token mode only.
      security: [{}]
      parameters:
        - $ref: "#/components/parameters/RequestHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: Session cookie set for 12 h.
        "401":
          description: Wrong token.
        "403":
          description: Host not allowed or request header missing.
    get:
      operationId: signIn
      summary: Start a sign-in at the OpenID Connect provider; oidc mode only.
      description: |
        Redirects to the provider's authorization endpoint with the
        authorization code flow, PKCE (S256), state and nonce, which a
        cookie holds for 10 min. The provider returns the browser to
        <auth.oidc.publicUrl>/api/v1/login/callback.
      security: [{}]
      parameters:
        - name: return
          in: query
          required: false
          description: The path on this origin to return to after the sign-in; / when absent or not such a path.
          schema:
            type: string
      responses:
        "303":
          description: To the provider.
        "403":
          description: Host not allowed.
        "502":
          description: The provider's metadata could not be read.
  /login/callback:
    get:
      operationId: signInCallback
      summary: The redirect URI of oidc mode.
      description: |
        Redeems the code, checks the ID token and sets the session cookie,
        valid for auth.oidc.sessionTtl (8 h by default) whatever the ID
        token's lifetime; the role is the one the ID token grants and holds
        until the next sign-in. Failures answer in text/plain.
      security: [{}]
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Signed in; to the path the sign-in started from.
        "400":
          description: No sign-in in progress, or another one's state.
        "401":
          description: The provider refused the sign-in, or the ID token is invalid.
        "403":
          description: Host not allowed, or the user has no role.
        "502":
          description: The provider could not be reached or did not redeem the code.
  /logout:
    post:
      operationId: logOut
      summary: Clear the session cookie and end the session; token and oidc mode.
      description: |
        Ends the session on the replica that answers, for every copy of the
        cookie, and closes the WebSockets opened with it there.
      security: [{}]
      parameters:
        - $ref: "#/components/parameters/RequestHeader"
      responses:
        "200":
          description: Session cookie cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Logout"
        "403":
          description: Host not allowed or request header missing.
components:
  securitySchemes:
    bearer:
      description: The API token (token mode, and oidc mode when configured) or, in oidc mode, an access token of the provider.
      type: http
      scheme: bearer
    session:
      description: Set by POST /login in token mode and by the sign-in in oidc mode.
      type: apiKey
      in: cookie
      name: samplez_session
  parameters:
    RequestHeader:
      name: X-Samplez-Request
      in: header
      required: true
      description: Required on state-changing requests without a bearer token.
      schema:
        type: string
        const: "1"
    SceneId:
      name: sceneId
      in: path
      required: true
      schema:
        $ref: "./ws/model.schema.json#/$defs/Id"
    ConsoleId:
      name: consoleId
      in: path
      required: true
      schema:
        $ref: "./ws/model.schema.json#/$defs/Id"
  schemas:
    Session:
      type: object
      required: [mode, user, role]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [none, token, proxy, oidc]
        user:
          description: The user the proxy or the OpenID provider names; null when not signed in, in none and token mode.
          type: [string, "null"]
        role:
          description: null when not signed in. A viewer's writes are refused.
          enum: [operator, viewer, null]
    Logout:
      type: object
      required: [redirect]
      additionalProperties: false
      properties:
        redirect:
          description: In oidc mode with a provider that has an end-session endpoint, where the browser goes next to end its session there too.
          type: [string, "null"]
    CommandResult:
      type: object
      required: [result, revision]
      additionalProperties: false
      properties:
        commandId:
          description: Echo of the request's commandId; absent for requests without one.
          $ref: "./ws/model.schema.json#/$defs/CommandId"
        result:
          description: applied, or duplicate when the command id was applied before (revision is the one it was applied at), or noop when nothing changed.
          type: string
          enum: [applied, duplicate, noop]
        revision:
          $ref: "./ws/model.schema.json#/$defs/Revision"
        atIndex:
          $ref: "./ws/model.schema.json#/$defs/SampleIndex"
    Error:
      description: |
        A refused request. Requests without valid credentials get 401 in
        token and oidc mode, and requests the browser protections refuse get 403,
        with this body as well.
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: integer
          enum: [400, 401, 403, 404, 409, 503]
        message:
          type: string
        conflicts:
          type: array
          items:
            $ref: "./ws/model.schema.json#/$defs/Conflict"
  responses:
    CommandResult:
      description: The command was processed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandResult"
    SceneResult:
      description: The scene was stored.
      content:
        application/json:
          schema:
            type: object
            required: [scene, result]
            additionalProperties: false
            properties:
              scene:
                $ref: "./ws/model.schema.json#/$defs/Scene"
              result:
                $ref: "#/components/schemas/CommandResult"
    Console:
      description: The console's status.
      content:
        application/json:
          schema:
            $ref: "./ws/model.schema.json#/$defs/ConsoleStatus"
    Error:
      description: The request was refused.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotApplied:
      description: |
        The write was not applied when the serving replica answered, for example
        while it had no leader or quorum, or did not see the write commit within
        its write timeout. In the second case the write may still be applied
        later, at most once. Sending the request again with the same commandId
        returns its one outcome.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: A control in the request is owned by a session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
